<!DOCTYPE html>
<html lang="de" data-design="modern">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Regenradar">
<meta name="theme-color" content="#ECEAF4">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20261008d">
<title>Regenradar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<!-- Dieselben zwei Designs wie die Startseite; die dort gespeicherte Wahl gilt auch hier. -->
<link rel="stylesheet" href="modern.css?v=20261008t" id="cssModern">
<link rel="stylesheet" href="design.css?v=20261008t" id="cssClassic" disabled>
<script>
(function () {
    var d = null;
    try { d = localStorage.getItem("wetter:design"); } catch (e) {}
    if (d === "classic") {
        document.getElementById("cssModern").disabled = true;
        document.getElementById("cssClassic").disabled = false;
        document.documentElement.setAttribute("data-design", "classic");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", "#2a558c");
    }
})();
</script>
<style>
    /* ---------- Radar-Seite: Karte füllt den Platz zwischen Kopfzeile und Navigation ---------- */
    html, body { height: 100%; }
    body.radar { overflow: hidden; min-height: 0; }
    .rshell {
        height: 100vh; height: 100dvh;
        display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
        max-width: 640px; margin: 0 auto;
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    }
    /* Grid-Elemente dürfen nicht breiter als die Spalte werden (das Legendenbild ist breit und wird gewischt) */
    .rshell > * { min-width: 0; }
    .rshell .top { padding-bottom: 10px; }
    a.loc { text-decoration: none; }

    .rmap { position: relative; border-radius: var(--radius, 22px); overflow: hidden; background: var(--white, #10213a); min-height: 140px; }
    #map { position: absolute; inset: 0; }
    #map .maplibregl-canvas { outline: none; }
    .maplibregl-ctrl-bottom-right { bottom: 6px; right: 6px; }
    .maplibregl-ctrl-attrib { font-family: inherit !important; font-size: 9px !important; background: rgba(255,255,255,0.75) !important; color: #5c5a55 !important; border-radius: 10px !important; }
    .maplibregl-ctrl-attrib a { color: var(--ink, #1E1B2E) !important; }
    .maplibregl-ctrl-attrib-button { background-color: rgba(255,255,255,0.75) !important; border-radius: 10px !important; }
    html[data-design="classic"] .maplibregl-ctrl-attrib, html[data-design="classic"] .maplibregl-ctrl-attrib-button { background: rgba(11,26,51,0.75) !important; color: #9fb3d1 !important; }
    html[data-design="classic"] .maplibregl-ctrl-attrib a { color: #cfe0f5 !important; }

    /* Zeit-Badge oben links: Uhrzeit und Beobachtung/Prognose eindeutig */
    .badge {
        position: absolute; top: 10px; left: 10px; z-index: 5;
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; border-radius: 999px;
        background: var(--dark, rgba(11,26,51,0.85)); color: var(--white, #fff);
        font-size: 13px; font-weight: 700; box-shadow: 0 6px 18px rgba(30,27,46,0.2);
        font-variant-numeric: tabular-nums;
    }
    .badge .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--rain, #BFD6F6); color: var(--rain-ink, #3A4A6B); transition: background-color 0.6s, color 0.6s; }
    .badge .pill.fc { background: var(--sun, #F6D35B); color: var(--ink, #1E1B2E); }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--white, #fff); opacity: 0; transition: opacity 0.3s; }
    .badge.loading .dot { opacity: 1; animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1); opacity: 1; } }
    .badge.tick { animation: tick 0.5s ease-out; }
    @keyframes tick { from { transform: translateY(-3px); opacity: 0.6; } to { transform: none; opacity: 1; } }

    /* Knöpfe rechts: Zoom und Zurückzentrieren */
    .mapbtns { position: absolute; top: 10px; right: 10px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
    .mapbtn {
        width: 40px; height: 40px; border-radius: 14px; border: none; cursor: pointer;
        background: var(--white, #141c30); color: var(--ink, #fff);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 6px 18px rgba(30,27,46,0.18); font: inherit; font-size: 20px; font-weight: 700;
    }
    .mapbtn svg { width: 18px; height: 18px; }
    .mapbtn:active { transform: scale(0.94); }
    html[data-design="classic"] .mapbtn { background: rgba(11,26,51,0.85); color: #fff; }

    /* Status unten in der Karte: Ladefehler, Hinweise */
    .status {
        position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5;
        padding: 7px 12px; border-radius: 999px; max-width: calc(100% - 24px);
        background: var(--dark, rgba(11,26,51,0.85)); color: var(--white, #fff);
        font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status.hidden { display: none; }

    .map-msg {
        position: absolute; inset: 0; z-index: 6;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        font-size: 14px; font-weight: 500; line-height: 1.6;
        color: var(--ink, #fff); background: var(--ground, rgba(11,26,51,0.85));
    }
    .map-msg.hidden { display: none; }

    .site-pin {
        width: 16px; height: 16px; border-radius: 50%;
        background: var(--dark, #7cc4ff); border: 3px solid var(--white, #0b1a33);
        box-shadow: 0 0 0 2px var(--dark, #7cc4ff), 0 2px 8px rgba(0,0,0,0.3);
    }

    /* ---------- Leiste unter der Karte: Play, Zeitachse, Legende ---------- */
    .rbar { padding: 10px 0 calc(var(--tab-h, 68px) + env(safe-area-inset-bottom) + 14px); display: flex; flex-direction: column; gap: 6px; }
    .rrow { display: flex; align-items: center; gap: 12px; }
    .play {
        width: 46px; height: 46px; flex: none; border-radius: 50%; border: none; cursor: pointer;
        background: var(--dark, #2563b0); color: var(--white, #fff);
        font-size: 16px; font-family: inherit; display: flex; align-items: center; justify-content: center;
    }
    html[data-design="classic"] .play { background: var(--accent, #ffd27a); color: #0b1a33; }
    .play.pop { animation: playPop 0.6s cubic-bezier(.2,.8,.2,1); }
    @keyframes playPop { 0% { transform: scale(0.86); } 60% { transform: scale(1.06); } 100% { transform: none; } }
    .play:active { transform: scale(0.92); }
    .timeline { flex: 1; min-width: 0; }
    input[type="range"] { width: 100%; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: var(--white, rgba(255,255,255,0.14)); outline: none; display: block; }
    html[data-design="classic"] input[type="range"] { background: rgba(255,255,255,0.18); }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 26px; height: 26px; border-radius: 50%;
        background: var(--dark, #7cc4ff); border: 3px solid var(--white, #0b1a33); box-shadow: 0 2px 8px rgba(30,27,46,0.25);
    }
    html[data-design="classic"] input[type="range"]::-webkit-slider-thumb { background: var(--accent, #ffd27a); border-color: #0b1a33; }
    .ticks { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--ink-2, #9fb3d1); margin-top: 6px; }

    .legend { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: var(--ink-2, #9fb3d1); }
    .legend .chip { display: flex; align-items: center; padding: 3px 8px; border-radius: 10px; background: #fff; flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .legend .chip::-webkit-scrollbar { display: none; }
    .legend img { height: 16px; max-width: none; display: block; }
    .legend .fallback { display: none; width: 160px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #8fd8ff, #3f97e0, #2455c8, #8a3fc4, #d63a6e); }
    .legend.noimg img { display: none; }
    .legend.noimg .fallback { display: block; }
    .rnote { font-size: 11px; color: var(--ink-2, #9fb3d1); line-height: 1.4; }

    /* Querformat auf dem Telefon: alles in einer Zeile, Karte bekommt die Höhe */
    @media (orientation: landscape) and (max-height: 520px) {
        .rshell .top { padding: calc(env(safe-area-inset-top) + 6px) 0 6px; }
        .rshell .loc, .rshell .iconbtn { height: 36px; }
        .rshell .loc { padding: 0 12px; }
        .rbar { flex-direction: row; align-items: center; gap: 12px; padding-top: 6px; padding-bottom: calc(var(--tab-h, 68px) + env(safe-area-inset-bottom) + 16px); }
        .rrow { flex: 1; min-width: 0; }
        .timeline { flex: 1; }
        .ticks { margin-top: 2px; }
        .legend { flex: 0 0 auto; width: 170px; }
        .rnote { display: none; }
        .play { width: 40px; height: 40px; }
    }
    /* Desktop: breitere Karte */
    @media (min-width: 900px) and (min-height: 600px) {
        .rshell { max-width: 960px; }
        .rmap { min-height: 420px; }
    }
</style>
</head>
<body class="theme-rain radar">

<div class="sky" aria-hidden="true">
    <div class="orb a"></div>
    <div class="orb b"></div>
</div>

<div class="design-veil" id="designVeil" aria-hidden="true"></div>

<div class="rshell">

    <header class="top">
        <a class="loc a-left" href="index.html" aria-label="Zurück zur Wetter-App">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            <span>Regenradar</span>
        </a>
        <div class="top-actions">
            <button type="button" class="iconbtn a-pop" id="designBtn" aria-label="Design wechseln" title="Design wechseln" style="animation-delay:.05s">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-.9-.9-1.3-.9-2.2 0-.8.7-1.5 1.6-1.5H17a4 4 0 0 0 4-4 8.5 8.5 0 0 0-9-8.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></svg>
            </button>
            <button type="button" class="iconbtn a-pop" id="refresh" aria-label="Radar aktualisieren" style="animation-delay:.1s">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
            </button>
        </div>
    </header>

    <div class="rmap a-pop" style="animation-delay:.15s">
        <div id="map" role="application" aria-label="Regenradar-Karte"></div>
        <div class="badge" id="badge" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="frameTime">–:–</span>
            <span class="pill" id="framePill">Beobachtung</span>
        </div>
        <div class="mapbtns">
            <button type="button" class="mapbtn" id="zoomIn" aria-label="Hineinzoomen">+</button>
            <button type="button" class="mapbtn" id="zoomOut" aria-label="Herauszoomen">−</button>
            <button type="button" class="mapbtn" id="recenter" aria-label="Auf den gewählten Ort zentrieren" title="Zum Ort">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </button>
        </div>
        <div class="status hidden" id="status" role="status"></div>
        <div class="map-msg" id="mapMsg">Radar wird geladen …</div>
    </div>

    <div class="rbar a-up" style="animation-delay:.4s">
        <div class="rrow">
            <button class="play" id="play" aria-label="Abspielen">▶</button>
            <div class="timeline">
                <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Zeitpunkt">
                <div class="ticks"><span id="tickStart">–50 min</span><span>jetzt</span><span id="tickEnd">+2 h</span></div>
            </div>
        </div>
        <div class="legend" id="legend">
            <span>mm/h</span>
            <span class="chip">
                <img id="legendImg" alt="Farbskala Niederschlagsintensität des DWD" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
                <span class="fallback"></span>
            </span>
        </div>
        <div class="rnote" id="note">DWD-Radar alle 5 Minuten, Prognose (RADOLAN RV) bis zwei Stunden voraus. Karte: OpenFreeMap, Daten © OpenStreetMap-Mitwirkende.</div>
    </div>
</div>

<div class="tabs">
    <nav aria-label="Bereiche" class="a-nav" style="animation-delay:.45s">
        <span class="tab-ink" aria-hidden="true"></span>
        <a href="index.html#sec-today" aria-label="Heute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Heute</span></a>
        <a href="index.html#sec-details" aria-label="Details">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Details</span></a>
        <a href="index.html#sec-days" aria-label="Tage">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Tage</span></a>
        <a href="radar.html" class="on" aria-label="Radar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v9l6-6"/></svg><span>Radar</span></a>
    </nav>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
